name: Morning Brief controller (inactive until approved)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, preview, dry-run, import]
        default: check
      approval:
        type: string
        default: ''
      snapshot_commit:
        type: string
        default: ''
      snapshot_sha256:
        type: string
        default: ''
  # NO active cron. Enable only after live acceptance and separate approval.
permissions:
  contents: read
concurrency:
  group: investment-discovery-cloud
  cancel-in-progress: false
jobs:
  controller:
    if: >-
      github.repository == 'DewayneRandall/morning-brief-controller' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'check' || inputs.mode == 'preview' ||
       inputs.mode == 'dry-run' || inputs.mode == 'import') &&
      (inputs.mode != 'dry-run' || inputs.approval == 'APPROVE_NO_SEND_DRY_RUN') &&
      (inputs.mode != 'import' ||
       (inputs.approval == 'IMPORT_ENCRYPTED_STATE_ONLY' && github.run_attempt == 1 &&
        vars.DISCOVERY_STATE_BACKEND != 'github'))
    environment: cloud-discovery
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISCOVERY_APPLICATION_SHA: f1180a5c3e9f679b5b13dfeef7a3a8607658ae7a
    steps:
      - name: Validate immutable application pin
        env:
          APP_PIN: f1180a5c3e9f679b5b13dfeef7a3a8607658ae7a
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch('[0-9a-f]{40}', os.environ['APP_PIN']):
              raise SystemExit('Reviewed immutable application pin required')
          PY
      - name: Verify private application before executing its pinned code
        env:
          SOURCE_READ_TOKEN: ${{ secrets.APPLICATION_READ_TOKEN }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/DewayneRandall/investment-research-agent',
              headers={'Authorization': 'Bearer ' + os.environ['SOURCE_READ_TOKEN']})
          with urllib.request.urlopen(request, timeout=20) as response:
              if json.load(response).get('private') is not True:
                  raise SystemExit('Application repository must remain private')
          PYCODE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DewayneRandall/investment-research-agent
          ref: f1180a5c3e9f679b5b13dfeef7a3a8607658ae7a
          token: ${{ secrets.APPLICATION_READ_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned reviewed application without state credentials
        working-directory: app
        run: |
          if ! python -m pip install '.[cloud]' > /tmp/brief-install.log 2>&1; then
            echo 'Pinned application installation failed; no private build output published.'
            exit 1
          fi
      - name: Verify public host, protected main and exact-main Environment policy
        working-directory: app
        env:
          CONTROLLER_METADATA_TOKEN: ${{ github.token }}
        run: python -m investment_research.controller_trust
      - name: Read-only private preview (no output of message bodies)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        working-directory: app
        env:
          DISCOVERY_STATE_BACKEND: github
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_GITHUB_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
        run: python -m investment_research.release_acceptance
      - name: Explicit one-time ciphertext import (no backend switch)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'import'
        working-directory: app
        env:
          DISCOVERY_STATE_BACKEND: ${{ vars.DISCOVERY_STATE_BACKEND }}
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_GITHUB_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
          IMPORT_APPROVAL: ${{ inputs.approval }}
          IMPORT_COMMIT: ${{ inputs.snapshot_commit }}
          IMPORT_SHA256: ${{ inputs.snapshot_sha256 }}
        run: python -m investment_research.github_state_import
      - name: Prepare current sources without semantic execution or delivery
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        working-directory: app
        env:
          DRY_RUN_APPROVAL: ${{ inputs.approval }}
          DISCOVERY_STATE_BACKEND: github
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_GITHUB_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
        run: python -m investment_research.controller_dry_run
      # No model runtime, provider API, credentials exported to Codex, cron or delivery.
