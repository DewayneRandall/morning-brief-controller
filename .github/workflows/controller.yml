name: Morning Brief controller (inactive until approved)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, preview, dry-run, state-test, import, handoff-export, handoff-submit, aaa-refresh-export, cycle-prepare, autonomous-cycle, telegram-commands, telegram-status, delivery-status, delivery-activate, deliver, delivery-reconcile, portfolio-import]
        default: check
      approval:
        type: string
        default: ''
      snapshot_commit:
        type: string
        default: ''
      snapshot_sha256:
        type: string
        default: ''
      recipient_public_key:
        type: string
        default: ''
      recipient_sha256:
        type: string
        default: ''
      handoff_id:
        type: string
        default: ''
      response_commit:
        type: string
        default: ''
      refresh_binding:
        type: string
        default: ''
      delivery_target:
        description: 'brief-<id> or brief-<id>:<1|2>:<DELIVERED|NOT_DELIVERED> (reconcile)'
        type: string
        default: ''
  # Both schedules are inert until the owner sets repository-level variables:
  # MORNING_BRIEF_AUTONOMOUS=enabled  -> '23 */6': export a cycle handoff when due (once per
  #   72 h) or submit the Codex Cloud response; never sends Telegram.
  # MORNING_BRIEF_TELEGRAM=enabled    -> '7,22,37,52': apply owner Telegram commands
  #   (replies only with MORNING_BRIEF_TELEGRAM_REPLIES=enabled).
  schedule:
    - cron: '23 */6 * * *'
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: investment-discovery-cloud
  cancel-in-progress: false
jobs:
  controller:
    if: >-
      github.repository == 'DewayneRandall/morning-brief-controller' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.event_name == 'schedule' && github.run_attempt == 1 &&
        ((github.event.schedule == '23 */6 * * *' && vars.MORNING_BRIEF_AUTONOMOUS == 'enabled') ||
         (github.event.schedule == '7,22,37,52 * * * *' && vars.MORNING_BRIEF_TELEGRAM == 'enabled'))) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'check' || inputs.mode == 'preview' ||
       inputs.mode == 'dry-run' || inputs.mode == 'state-test' || inputs.mode == 'import' ||
       inputs.mode == 'handoff-export' || inputs.mode == 'handoff-submit' ||
       inputs.mode == 'aaa-refresh-export' || inputs.mode == 'cycle-prepare' ||
       inputs.mode == 'autonomous-cycle' || inputs.mode == 'telegram-commands' ||
       inputs.mode == 'telegram-status' ||
       inputs.mode == 'delivery-status' || inputs.mode == 'delivery-activate' ||
       inputs.mode == 'deliver' || inputs.mode == 'delivery-reconcile' ||
       inputs.mode == 'portfolio-import') &&
      (inputs.mode != 'portfolio-import' ||
       (inputs.approval == 'IMPORT_ORIGINAL_PORTFOLIO' && github.run_attempt == 1)) &&
      (inputs.mode != 'dry-run' || inputs.approval == 'APPROVE_NO_SEND_DRY_RUN') &&
      (inputs.mode != 'cycle-prepare' ||
       (inputs.approval == 'PREPARE_MORNING_BRIEF_CYCLE' && github.run_attempt == 1)) &&
      (inputs.mode != 'autonomous-cycle' ||
       (inputs.approval == 'PREPARE_MORNING_BRIEF_CYCLE' && github.run_attempt == 1)) &&
      (inputs.mode != 'telegram-commands' ||
       ((inputs.approval == 'PROCESS_TELEGRAM_COMMANDS' ||
         inputs.approval == 'PROCESS_TELEGRAM_COMMANDS_WITH_REPLIES') && github.run_attempt == 1)) &&
      (inputs.mode != 'delivery-activate' ||
       (inputs.approval == 'ACTIVATE_BRIEF_DELIVERY' && github.run_attempt == 1)) &&
      (inputs.mode != 'deliver' ||
       (inputs.approval == 'DELIVER_PREPARED_MORNING_BRIEF' && github.run_attempt == 1)) &&
      (inputs.mode != 'delivery-reconcile' ||
       (inputs.approval == 'RECONCILE_BRIEF_DELIVERY' && github.run_attempt == 1)) &&
      (inputs.mode != 'state-test' ||
       (inputs.approval == 'RUN_SYNTHETIC_STATE_TEST_ONLY' && github.run_attempt == 1)) &&
      (inputs.mode != 'handoff-export' ||
       (inputs.approval == 'EXPORT_MARKET_TASKS_TO_CODEX' && github.run_attempt == 1)) &&
      (inputs.mode != 'handoff-submit' ||
       (inputs.approval == 'VALIDATE_CODEX_MARKET_SUBMISSIONS' && github.run_attempt == 1)) &&
      (inputs.mode != 'aaa-refresh-export' ||
       (inputs.approval == 'REFRESH_LATEST_AAA_AND_EXPORT' && github.run_attempt == 1)) &&
      (inputs.mode != 'import' ||
       (inputs.approval == 'IMPORT_ENCRYPTED_STATE_ONLY' && github.run_attempt == 1 &&
        vars.DISCOVERY_STATE_BACKEND != 'github'))))
    environment: cloud-discovery
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISCOVERY_APPLICATION_SHA: 4517510551ce30e7359f1cae17d1e0b6d2eac7a8
    steps:
      - name: Validate immutable application pin
        env:
          APP_PIN: 4517510551ce30e7359f1cae17d1e0b6d2eac7a8
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch('[0-9a-f]{40}', os.environ['APP_PIN']):
              raise SystemExit('Reviewed immutable application pin required')
          PY
      - name: Verify private application before executing its pinned code
        env:
          SOURCE_READ_TOKEN: ${{ secrets.APPLICATION_READ_TOKEN }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/DewayneRandall/investment-research-agent',
              headers={'Authorization': 'Bearer ' + os.environ['SOURCE_READ_TOKEN']})
          with urllib.request.urlopen(request, timeout=20) as response:
              if json.load(response).get('private') is not True:
                  raise SystemExit('Application repository must remain private')
          PYCODE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DewayneRandall/investment-research-agent
          ref: 4517510551ce30e7359f1cae17d1e0b6d2eac7a8
          token: ${{ secrets.APPLICATION_READ_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned reviewed application without state credentials
        working-directory: app
        run: |
          if ! python -m pip install --editable '.[cloud]' > /tmp/brief-install.log 2>&1; then
            echo 'Pinned application installation failed; no private build output published.'
            exit 1
          fi
      - name: Install audio decoder for podcast boundary verification
        if: >-
          github.event.schedule == '23 */6 * * *' || inputs.mode == 'dry-run' ||
          inputs.mode == 'cycle-prepare' || inputs.mode == 'aaa-refresh-export' ||
          inputs.mode == 'autonomous-cycle'
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Verify public host, protected main and exact-main Environment policy
        working-directory: app
        env:
          CONTROLLER_METADATA_TOKEN: ${{ github.token }}
        run: python -m investment_research.controller_trust
      - name: Verify configured Cloud handoff recipient (read only)
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.mode == 'check' &&
          inputs.recipient_sha256 != ''
        working-directory: app
        env:
          CODEX_RECIPIENT_PUBLIC_KEY: ${{ vars.CODEX_RECIPIENT_PUBLIC_KEY }}
          CODEX_RECIPIENT_SHA256: ${{ vars.CODEX_RECIPIENT_SHA256 }}
          EXPECTED_RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
        run: |
          python - <<'PYCODE'
          import hmac
          import os

          from investment_research.codex_handoff import recipient

          try:
              fingerprint = os.environ["CODEX_RECIPIENT_SHA256"]
              recipient(os.environ["CODEX_RECIPIENT_PUBLIC_KEY"], fingerprint)
              if not hmac.compare_digest(fingerprint, os.environ["EXPECTED_RECIPIENT_SHA256"]):
                  raise ValueError("Different recipient")
          except (KeyError, TypeError, ValueError):
              raise SystemExit("controller_recipient=FAIL") from None
          print("controller_recipient=PASS")
          PYCODE
      - name: Isolated encrypted state persistence test (synthetic only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'state-test'
        working-directory: app
        env:
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_TEST_APPROVAL: ${{ inputs.approval }}
          STATE_TEST_READ_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
          STATE_TEST_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
        run: python -m investment_research.state_validation
      - name: Read-only private preview (no output of message bodies)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        working-directory: app
        env:
          DISCOVERY_STATE_BACKEND: github
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_GITHUB_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
        run: python -m investment_research.release_acceptance
      - name: Explicit one-time ciphertext import (no backend switch)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'import'
        working-directory: app
        env:
          DISCOVERY_STATE_BACKEND: ${{ vars.DISCOVERY_STATE_BACKEND }}
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_GITHUB_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
          IMPORT_APPROVAL: ${{ inputs.approval }}
          IMPORT_COMMIT: ${{ inputs.snapshot_commit }}
          IMPORT_SHA256: ${{ inputs.snapshot_sha256 }}
        run: python -m investment_research.github_state_import
      - name: Prepare current sources without semantic execution or delivery
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        working-directory: app
        env:
          DRY_RUN_APPROVAL: ${{ inputs.approval }}
          DISCOVERY_STATE_BACKEND: github
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_GITHUB_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
        run: python -m investment_research.controller_dry_run
      - name: Export recipient-encrypted market tasks to private data repository
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'handoff-export'
        working-directory: app
        env:
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_READ_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
          DISCOVERY_STATE_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
          CODEX_HANDOFF_MODE: export
          CODEX_HANDOFF_APPROVAL: ${{ inputs.approval }}
          CODEX_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          CODEX_RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
        run: python -m investment_research.codex_handoff --mode export
      - name: Validate encrypted Codex results and checkpoint existing Discovery state
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'handoff-submit'
        working-directory: app
        env:
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_READ_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
          DISCOVERY_STATE_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
          CODEX_HANDOFF_MODE: submit
          CODEX_HANDOFF_APPROVAL: ${{ inputs.approval }}
          CODEX_HANDOFF_ID: ${{ inputs.handoff_id }}
          CODEX_RESPONSE_COMMIT: ${{ inputs.response_commit }}
        run: python -m investment_research.codex_handoff --mode submit
      - name: Refresh one bound official AAA source and export verified encrypted handoff
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'aaa-refresh-export'
        working-directory: app
        env:
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_READ_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
          DISCOVERY_STATE_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
          CODEX_HANDOFF_MODE: aaa-refresh-export
          CODEX_HANDOFF_APPROVAL: ${{ inputs.approval }}
          CODEX_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          CODEX_RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
          AAA_REFRESH_BINDING: ${{ inputs.refresh_binding }}
        run: python -m investment_research.codex_handoff --mode aaa-refresh-export
      - name: Acquire current sources, checkpoint and export encrypted cycle handoff
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cycle-prepare'
        working-directory: app
        env:
          CYCLE_MODE: prepare
          CYCLE_APPROVAL: ${{ inputs.approval }}
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_READ_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
          DISCOVERY_STATE_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
          CODEX_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          CODEX_RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
        run: python -m investment_research.brief_cycle
      - name: Scheduled cycle - export handoff when due or submit Codex Cloud response (never sends)
        if: github.event.schedule == '23 */6 * * *' || inputs.mode == 'autonomous-cycle'
        working-directory: app
        env:
          CYCLE_MODE: prepare
          CYCLE_APPROVAL: ${{ inputs.approval }}
          MORNING_BRIEF_AUTOMATION: ${{ github.event_name == 'schedule' && vars.MORNING_BRIEF_AUTONOMOUS || '' }}
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_READ_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
          DISCOVERY_STATE_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
          CODEX_RECIPIENT_PUBLIC_KEY: ${{ vars.CODEX_RECIPIENT_PUBLIC_KEY }}
          CODEX_RECIPIENT_SHA256: ${{ vars.CODEX_RECIPIENT_SHA256 }}
        run: python -m investment_research.autonomous
      - name: Owner Telegram commands - watchlist and Deep Dive requests
        if: github.event.schedule == '7,22,37,52 * * * *' || inputs.mode == 'telegram-commands'
        working-directory: app
        env:
          TELEGRAM_COMMAND_MODE: process
          TELEGRAM_COMMAND_SCOPE: watchlist-and-research
          TELEGRAM_APPROVAL: ${{ inputs.approval }}
          MORNING_BRIEF_AUTOMATION: ${{ github.event_name == 'schedule' && vars.MORNING_BRIEF_TELEGRAM || '' }}
          TELEGRAM_REPLIES: ${{ github.event_name == 'workflow_dispatch' && inputs.approval == 'PROCESS_TELEGRAM_COMMANDS_WITH_REPLIES' && 'enabled' || vars.MORNING_BRIEF_TELEGRAM_REPLIES }}
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m investment_research.telegram_commands
      - name: Verify Telegram journal and receipts (read only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'telegram-status'
        working-directory: app
        env:
          TELEGRAM_COMMAND_MODE: status
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_READ_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
        run: python -m investment_research.telegram_commands
      - name: Read delivery ledger status (no send, no write)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'delivery-status'
        working-directory: app
        env:
          BRIEF_DELIVERY_MODE: status
          BRIEF_DELIVERY_TARGET: ${{ inputs.delivery_target }}
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_READ_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
        run: python -m investment_research.brief_delivery
      - name: Record owner activation or reconciliation (no send)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.mode == 'delivery-activate' || inputs.mode == 'delivery-reconcile')
        working-directory: app
        env:
          BRIEF_DELIVERY_MODE: ${{ inputs.mode == 'delivery-activate' && 'activate' || 'reconcile' }}
          BRIEF_DELIVERY_APPROVAL: ${{ inputs.approval }}
          BRIEF_DELIVERY_TARGET: ${{ inputs.delivery_target }}
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
        run: python -m investment_research.brief_delivery
      - name: Deliver the prepared two-message brief (gated, exactly once)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deliver'
        working-directory: app
        env:
          BRIEF_DELIVERY_MODE: deliver
          BRIEF_DELIVERY_APPROVAL: ${{ inputs.approval }}
          BRIEF_DELIVERY_TARGET: ${{ inputs.delivery_target }}
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m investment_research.brief_delivery
      - name: Import the sealed ORIGINAL portfolio once (validated, no overwrite)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'portfolio-import'
        working-directory: app
        env:
          PORTFOLIO_IMPORT_APPROVAL: ${{ inputs.approval }}
          RECOVERY_COMMIT: ${{ inputs.snapshot_commit }}
          RECOVERY_SHA256: ${{ inputs.snapshot_sha256 }}
          DISCOVERY_STATE_KEY: ${{ secrets.DISCOVERY_STATE_KEY }}
          DISCOVERY_STATE_REPOSITORY: ${{ vars.DISCOVERY_STATE_REPOSITORY }}
          DISCOVERY_STATE_READ_TOKEN: ${{ secrets.DISCOVERY_STATE_READ_TOKEN }}
          DISCOVERY_STATE_WRITE_TOKEN: ${{ secrets.DISCOVERY_STATE_WRITE_TOKEN }}
        run: python -m investment_research.portfolio_recovery
      # No model runtime, provider API, credentials exported to Codex or active cron.
      # Telegram credentials exist only in the gated 'deliver' step above.
