name: Controller validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  controller-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Verify controller-only tree and inactive production routes
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml
          allowed = {'README.md', '.github/workflows/controller.yml', '.github/workflows/validate.yml'}
          files = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          if files != allowed:
              raise SystemExit('Only reviewed public orchestration files are allowed')
          workflow = yaml.safe_load(Path('.github/workflows/controller.yml').read_text())
          if set(workflow[True]) != {'workflow_dispatch'}:
              raise SystemExit('Manual-only controller required')
          serialized = str(workflow)
          for denied in ('docker ', 'LOCAL_INFERENCE', 'OPENAI_API_KEY', 'TELEGRAM_BOT_TOKEN'):
              if denied in serialized:
                  raise SystemExit('Unapproved inference/delivery route')
          job = workflow['jobs']['controller']
          if job['environment'] != 'cloud-discovery' or 'github.ref_protected' not in job['if']:
              raise SystemExit('Protected-main Environment boundary required')
          if 'secrets.' in str(job.get('env', {})):
              raise SystemExit('Job-wide secret injection forbidden')
          for step in job['steps']:
              if 'checkout@' in step.get('uses', ''):
                  if step['with'].get('persist-credentials') is not False:
                      raise SystemExit('Checkout credentials must not persist')
          print('Controller-only content and manual no-send routes validated.')
          PY
