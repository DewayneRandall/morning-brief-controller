name: Controller validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  controller-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Verify controller-only tree and inactive production routes
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml
          allowed = {'README.md', '.github/workflows/controller.yml', '.github/workflows/validate.yml'}
          files = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          if files != allowed:
              raise SystemExit('Only reviewed public orchestration files are allowed')
          workflow = yaml.safe_load(Path('.github/workflows/controller.yml').read_text())
          triggers = set(workflow[True])
          if not triggers <= {'workflow_dispatch', 'schedule'} or 'workflow_dispatch' not in triggers:
              raise SystemExit('Manual or owner-gated scheduled controller required')
          serialized = str(workflow)
          for denied in ('docker ', 'LOCAL_INFERENCE', 'OPENAI_API_KEY'):
              if denied in serialized:
                  raise SystemExit('Unapproved inference route')
          job = workflow['jobs']['controller']
          if 'schedule' in triggers:
              # A cron alone does nothing: the owner's repository variable must enable it,
              # and only the unattended no-send cycle step may react to a schedule.
              condition = ' '.join(job['if'].split())
              crons = {entry['cron'] for entry in workflow[True]['schedule']}
              gates = {"'23 */6 * * *'": "vars.MORNING_BRIEF_AUTONOMOUS == 'enabled'",
                       "'7,22,37,52 * * * *'": "vars.MORNING_BRIEF_TELEGRAM == 'enabled'"}
              if crons != {c.strip("'") for c in gates} or any(
                      f"github.event.schedule == {cron} && {gate}" not in condition
                      for cron, gate in gates.items()):
                  raise SystemExit('Every schedule requires its owner variable')
              allowed = ('Install audio decoder', 'Scheduled cycle', 'Owner Telegram commands')
              for step in job['steps']:
                  if 'schedule' in str(step.get('if', '')) and not step.get(
                          'name', '').startswith(allowed):
                      raise SystemExit('Only the no-send cycle and Telegram commands run on schedule')
          # Telegram credentials: the approval-gated 'deliver' step (briefs) and the owner
          # command step (replies only to the owner's own commands). Nothing else.
          telegram = [s for s in job['steps'] if 'TELEGRAM_BOT_TOKEN' in str(s.get('env', {}))]
          deliver = [s for s in telegram if s.get('env', {}).get('BRIEF_DELIVERY_MODE') == 'deliver']
          commands = [s for s in telegram if s.get('env', {}).get('TELEGRAM_COMMAND_MODE') == 'process']
          if len(telegram) != len(deliver) + len(commands) or len(deliver) > 1 or len(commands) > 1:
              raise SystemExit('Unapproved Telegram route')
          if deliver and ("inputs.mode == 'deliver'" not in deliver[0].get('if', '')
                          or 'schedule' in deliver[0].get('if', '')
                          or 'DELIVER_PREPARED_MORNING_BRIEF' not in job['if']):
              raise SystemExit('Unapproved delivery route')
          if commands and (commands[0]['run'].strip() != 'python -m investment_research.telegram_commands'
                           or 'PROCESS_TELEGRAM_COMMANDS' not in job['if']):
              raise SystemExit('Unapproved Telegram command route')
          if commands and (
                  commands[0]['env'].get('TELEGRAM_COMMAND_SCOPE') != 'watchlist-and-research'
                  or "github.event_name == 'workflow_dispatch' && inputs.approval == "
                     "'PROCESS_TELEGRAM_COMMANDS_WITH_REPLIES'" not in commands[0]['env'].get('TELEGRAM_REPLIES', '')
                  or "'PROCESS_TELEGRAM_COMMANDS_WITH_REPLIES') && github.run_attempt == 1" not in
                     ' '.join(job['if'].split())):
              raise SystemExit('One-time replies require explicit watchlist/research approval')
          statuses = [s for s in job['steps'] if s.get('env', {}).get('TELEGRAM_COMMAND_MODE') == 'status']
          if len(statuses) != 1 or set(statuses[0]['env']) != {
                  'TELEGRAM_COMMAND_MODE', 'DISCOVERY_STATE_KEY',
                  'DISCOVERY_STATE_REPOSITORY', 'DISCOVERY_STATE_READ_TOKEN'}:
              raise SystemExit('Telegram status must use the independent read credential only')
          if job['environment'] != 'cloud-discovery' or 'github.ref_protected' not in job['if']:
              raise SystemExit('Protected-main Environment boundary required')
          if 'secrets.' in str(job.get('env', {})):
              raise SystemExit('Job-wide secret injection forbidden')
          for step in job['steps']:
              if 'checkout@' in step.get('uses', ''):
                  if step['with'].get('persist-credentials') is not False:
                      raise SystemExit('Checkout credentials must not persist')
          print('Controller-only content, owner-gated schedules and gated Telegram routes validated.')
          PY
